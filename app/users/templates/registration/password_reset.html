{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Сброс пароля" %}{% endblock %}

{% block content %}
  <div class="container mt-5" style="max-width: 450px;">
      <h3 class="mb-4 text-center">{% trans "Сброс пароля" %}</h3>
      <p>{% trans "Введите ваш email, чтобы получить ссылку на сброс пароля." %}</p>
    
      <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        <button type="submit" class="btn btn-primary w-100 mt-3">
          {% trans "Отправить ссылку" %}
        </button>
      </form>
  </div>
{% endblock %}
